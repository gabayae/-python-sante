# =====================================================================
# Build et publication automatique du site Quarto
#
# Declenche a chaque push sur main (ou manuellement via l'onglet Actions
# du depot). Le site rendu est publie sur la branche gh-pages, que
# GitHub Pages sert ensuite a https://gabayae.github.io/-python-sante/
#
# Configuration unique a faire dans Settings > Pages :
#   Source = Deploy from a branch
#   Branch = gh-pages, dossier = / (root)
# =====================================================================

name: Build & deploy Quarto site

on:
  push:
    branches: [main]
  # Permet de relancer manuellement depuis l'UI Actions
  workflow_dispatch:

# Empeche deux runs simultanes (le 2eme attend la fin du 1er)
concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: write    # necessaire pour pousser sur gh-pages

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # historique complet pour quarto

      - name: Installer Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          # Epingler une version evite les ruptures silencieuses
          version: "1.8.27"

      # Pas besoin de Python ici : les notebooks .ipynb sont utilises
      # tels quels avec leurs sorties embarquees (execute: false dans
      # _quarto.yml). Pas de re-execution -> build rapide.

      - name: Render et publier sur gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
