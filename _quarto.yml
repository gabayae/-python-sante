# =====================================================================
# Quarto site config
# Render : quarto render
# Sortie : docs/   (GitHub Pages : Settings > Pages > main / docs)
# =====================================================================

project:
  type: website
  output-dir: docs
  render:
    - "index.qmd"
    - "about.qmd"
    - "notebooks_executes/index.ipynb"
    - "notebooks_executes/module_01_python_pandas.ipynb"
    - "notebooks_executes/module_02_nettoyage_descriptif.ipynb"
    - "notebooks_executes/module_03_visualisation.ipynb"
    - "notebooks_executes/module_04_tests_hypotheses.ipynb"
    - "notebooks_executes/module_05_regression.ipynb"
    - "notebooks_executes/module_06_ml_clinique.ipynb"

# ----- Ne JAMAIS re-executer les notebooks ; on utilise les sorties deja la
execute:
  freeze: true
  enabled: false

website:
  title: "Stéthoscope Numérique"
  description: "Cours condensé 6 h en français — analyse de données avec Python pour professionnels de la santé. L'analyse de données comme nouveau stéthoscope du clinicien."
  site-url: "https://gabayae.github.io/-python-sante/"
  repo-url: "https://github.com/gabayae/-python-sante"
  repo-actions: [edit, issue]
  page-navigation: true
  back-to-top-navigation: true
  favicon: favicon.svg

  navbar:
    background: primary
    search: true
    pinned: true
    collapse-below: lg
    left:
      - href: index.qmd
        text: Accueil
      - text: Modules
        menu:
          - text: "1 — Python et Pandas"
            href: notebooks_executes/module_01_python_pandas.ipynb
          - text: "2 — Nettoyage et descriptif"
            href: notebooks_executes/module_02_nettoyage_descriptif.ipynb
          - text: "3 — Visualisation"
            href: notebooks_executes/module_03_visualisation.ipynb
          - text: "4 — Tests d'hypothèses"
            href: notebooks_executes/module_04_tests_hypotheses.ipynb
          - text: "5 — Régression"
            href: notebooks_executes/module_05_regression.ipynb
          - text: "6 — ML clinique"
            href: notebooks_executes/module_06_ml_clinique.ipynb
      - href: notes/notes_6h.pdf
        text: Notes (PDF)
      - href: about.qmd
        text: À propos
    right:
      - icon: github
        href: https://github.com/gabayae/-python-sante
        aria-label: Voir sur GitHub

  sidebar:
    style: docked
    background: light
    collapse-level: 2
    contents:
      - text: "Accueil"
        href: index.qmd
      - section: "Modules"
        contents:
          - text: "1 — Python et Pandas"
            href: notebooks_executes/module_01_python_pandas.ipynb
          - text: "2 — Nettoyage et descriptif"
            href: notebooks_executes/module_02_nettoyage_descriptif.ipynb
          - text: "3 — Visualisation"
            href: notebooks_executes/module_03_visualisation.ipynb
          - text: "4 — Tests d'hypothèses"
            href: notebooks_executes/module_04_tests_hypotheses.ipynb
          - text: "5 — Régression"
            href: notebooks_executes/module_05_regression.ipynb
          - text: "6 — ML clinique"
            href: notebooks_executes/module_06_ml_clinique.ipynb
      - section: "Ressources"
        contents:
          - text: "Notes de cours (PDF)"
            href: notes/notes_6h.pdf
          - text: "Sommaire visuel (index)"
            href: notebooks_executes/index.ipynb
      - text: "À propos"
        href: about.qmd

  page-footer:
    border: true
    left: |
      © 2026 [Yaé Ulrich Gaba](https://github.com/gabayae) ·
      Distribué sous [CC BY-SA 4.0](https://github.com/gabayae/-python-sante/blob/main/LICENSE)
    right: |
      Construit avec [Quarto](https://quarto.org)

lang: fr

format:
  html:
    theme:
      light: [cosmo, theme.scss]
      dark:  [cosmo, darkly, theme-dark.scss]
    css: styles.css
    toc: true
    toc-depth: 3
    toc-location: right
    toc-title: "Sur cette page"
    smooth-scroll: true
    link-external-newwindow: true
    link-external-icon: true
    code-copy: true
    code-overflow: wrap
    anchor-sections: true
    fig-align: center
    page-layout: full
    notebook-links: global
    notebook-view: true

# Boutons « Open in Colab » sur chaque page de notebook
# (Quarto les genere automatiquement quand le repo-url est defini)
